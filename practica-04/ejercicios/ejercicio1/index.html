<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title> 
  <script>
    //propina y total a pagar
    function calcularPropina(cuenta, porcentajePropina) {
      //monto de la propina
      const propina = (cuenta * porcentajePropina) / 100;
      //cuenta + propina
      const total = cuenta + propina;
      return {
        propina: propina.toFixed(2),
        total: total.toFixed(2)
      };
    }

    //resultados
    function mostrarResultados() {
      const cuenta = parseFloat(document.getElementById("cuenta").value);
      const porcentajePropina = parseFloat(document.getElementById("porcentajePropina").value);

      //Verificacion de valores ingresados
      if (isNaN(cuenta) || isNaN(porcentajePropina) || cuenta <= 0 || porcentajePropina < 0) {
        alert("Por favor, ingrese valores válidos.");
        return;
      }
      const resultado = calcularPropina(cuenta, porcentajePropina);
      
      document.getElementById("resultado").innerHTML = 
        `Propina: $${resultado.propina}<br>Total a pagar: $${resultado.total}`;
    }
  </script>
  <style>
    .contenedor {
        border: 2px solid black; 
        border-radius: 20px; 
        background-color: lightgray; 
        width: 500px; 
        height: 350px; 
        margin: auto;
        padding: 10px;
        padding-top: 0;
        font-family: 'Courier New';
    }
    button {
        padding: 8px;
        border-radius: 5px;
    }
  </style>
</head>
<body>
    <div class="contenedor">

        <h1>Calculadora Propinas</h1>
        <p>Ingrese el monto de la cuenta y el porcentaje de propina:</p>
        
        <label for="cuenta">Monto de la cuenta:</label>
        <input type="number" id="cuenta" step="0.01" placeholder="Ej. 50.00"><br><br>

        <label for="porcentajePropina">Porcentaje de propina (%):</label>
        <input type="number" id="porcentajePropina" step="0.01" placeholder="Ej. 15"><br><br>

        <button onclick="mostrarResultados()">Calcular</button>

        <h2>Resultado:</h2>
        <div id="resultado"></div>
    </div>
</body>
</html>
